<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d94a3d"/>
      <stop offset="100%" stop-color="#a8302c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c674"/>
      <stop offset="100%" stop-color="#c9922e"/>
    </linearGradient>
  </defs>

  <!-- Фон: скруглённый квадрат -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Тонкая золотая рамка внутри -->
  <rect x="24" y="24" width="464" height="464" rx="92"
        fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.55"/>

  <!-- Декоративные уголки -->
  <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M 70 110 L 70 70 L 110 70"/>
    <path d="M 402 70 L 442 70 L 442 110"/>
    <path d="M 70 402 L 70 442 L 110 442"/>
    <path d="M 442 402 L 442 442 L 402 442"/>
  </g>

  <!-- Иероглиф 汉 -->
  <text x="256" y="330"
        font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, STHeiti, Noto Sans CJK SC, serif"
        font-size="240"
        font-weight="700"
        fill="#fdf6ec"
        text-anchor="middle">汉</text>

  <!-- Золотая черта под иероглифом -->
  <rect x="176" y="378" width="160" height="6" rx="3" fill="url(#gold)" opacity="0.85"/>
</svg>
